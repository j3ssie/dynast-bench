# Ground-truth answer key for the websocket vulnerable app.
# This file lives outside both build contexts and is never baked into an image.

app: websocket
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex; user2@bench.local is in Globex for cross-tenant realtime BOLA/IDOR.
  A Globex DRAFT carries GLOBEX-CONFIDENTIAL-MARKER-7f3a. Weak service credential admin/admin exists only in vuln.

vulnerabilities:
  - id: CSWSH-001
    variant_paths: { vuln: vuln/src/server.mjs, safe: safe/src/server.mjs }
    symbol: handle upgrade
    route: "GET /ws (Origin: evil)"
    transport: http
    cwe: CWE-1385
    owasp: "A01:2021-Broken Access Control"
    severity: high
    difficulty: M
    taint: in-file
    reachability: user
    near_miss: NM-ORIGIN-001
    match:
      http: { method: GET, path: "/ws" }
      file: { path: vuln/src/server.mjs, symbol: "handle upgrade", lines: [73, 73] }
      ws: { transport: http }
    poc: ground-truth/verify/cswsh_001.sh
    notes: "No Origin validation on raw /ws; /ws/secure is the near-miss."

