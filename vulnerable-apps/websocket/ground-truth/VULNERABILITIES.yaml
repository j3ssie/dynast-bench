near_misses:
  - id: NM-ORIGIN-001
    path: vuln/src/server.mjs
    symbol: /ws/secure upgrade path
    of: CSWSH-001
    match:
      file: { path: vuln/src/server.mjs, symbol: "/ws/secure upgrade path" }
    notes: "Checks Origin against the local allowlist and requires a ticket."
  - id: NM-SQL-001
    path: vuln/src/server.mjs
    symbol: post.list
    of: SQLI-001
    match:
      file: { path: vuln/src/server.mjs, symbol: post.list }
    notes: "Lists only published posts in the authenticated user org."
  - id: NM-MERGE-001
    path: vuln/src/server.mjs
    symbol: applyPresence
    of: PROTO-001
    match:
      file: { path: vuln/src/server.mjs, symbol: applyPresence, lines: [61, 61] }
    notes: "Copies only allowlisted scalar presence fields."
  - id: NM-CHANNEL-001
    path: vuln/src/server.mjs
    symbol: subscribeChannel safe branch
    of: CHAN-BOLA-001
    match:
      file: { path: vuln/src/server.mjs, symbol: "subscribeChannel safe branch" }
    notes: "Derives allowed org channel from the authenticated session."
  - id: NM-SIO-001
    path: vuln/src/server.mjs
    symbol: /rt namespace
    of: SIO-ADMIN-001
    match:
      file: { path: vuln/src/server.mjs, symbol: "/rt namespace" }
    notes: "Non-privileged namespace exposes only a ping event."
  - id: NM-FILTER-001
    path: vuln/src/server.mjs
    symbol: evalFilter safe parser
    of: RCE-001
    match:
      file: { path: vuln/src/server.mjs, symbol: "evalFilter safe parser" }
    notes: "Accepts only event.priority numeric comparisons."
