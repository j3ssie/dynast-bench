    severity: critical
    difficulty: H
    taint: cross-file
    reachability: pre-auth
    near_miss: null
    match:
      http: { method: GET, path: "/socket.io/", query: { transport: polling } }
      file: { path: vuln/src/server.mjs, symbol: "Socket.IO allowRequest", lines: [74, 75] }
      ws: { transport: socketio-polling }
    poc: ground-truth/verify/downgrade_001.sh
    notes: "Engine.IO polling transport bypasses the auth check applied to websocket transport."

