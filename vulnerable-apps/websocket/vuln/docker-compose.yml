name: vuln-websocket
services:
  app:
    build: ./
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:3000"]
    environment:
      DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
      INTERNAL_URL: http://internal-svc:9099
      TICKET_SECRET: hardcoded-ticket-secret
      VERIFY_TOKEN: benchsecret
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      internal-svc: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/_verify/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  postgres:
    image: postgres:16.4
    environment: { POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  internal-svc:
    image: node:22-alpine
    command: ["node", "/internal-sink.mjs"]
    volumes:
      - ./internal-sink.mjs:/internal-sink.mjs:ro
