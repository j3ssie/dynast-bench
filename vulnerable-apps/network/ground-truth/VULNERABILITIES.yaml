    route: "edge-proxy:443/tcp"
    cwe: CWE-295
    owasp: "A02:2021-Cryptographic Failures"
    severity: medium
    difficulty: E-M
    discovery: static-html
    taint: cross-service
    reachability: pre-auth
    near_miss: NM-TLS-001
    match:
      net: { host: edge-proxy, port: 443, proto: tcp }
      file: { path: vuln/docker-compose.yml, symbol: tls_expired }
    poc: ground-truth/verify/tls_expired.sh
