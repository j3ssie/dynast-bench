name: vuln-network
services:
  scanner:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    init: true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 1024
    build: { context: ., additional_contexts: { dynast-annotations: ../../../dynast-bench/tools/annotations } }
    environment: { ROLE: scanner, VARIANT: vuln, VERIFY_TOKEN: benchsecret }
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:3000"]
    networks:
      edge: { ipv4_address: 10.89.1.200 }
      app: {}
      data: {}
      mgmt: {}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/_verify/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  edge-proxy:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    build: { context: ., additional_contexts: { dynast-annotations: ../../../dynast-bench/tools/annotations } }
    environment: { ROLE: edge-proxy, VARIANT: vuln, VERIFY_TOKEN: benchsecret }
    ports: ["127.0.0.1:${DYNAST_PORT_EDGE_PROXY_80:-13312}:80", "127.0.0.1:${DYNAST_PORT_EDGE_PROXY_443:-13313}:443", "127.0.0.1:${DYNAST_PORT_EDGE_PROXY_8443:-13314}:8443"]
    networks:
      edge: { ipv4_address: 10.89.1.10 }
      data: {}   # planted edge->data segmentation break

  edge-bastion:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    build: { context: ., additional_contexts: { dynast-annotations: ../../../dynast-bench/tools/annotations } }
    environment: { ROLE: edge-bastion, VARIANT: vuln, VERIFY_TOKEN: benchsecret }
    networks:
      edge: { ipv4_address: 10.89.1.11 }

  edge-ftp:
    restart: unless-stopped
