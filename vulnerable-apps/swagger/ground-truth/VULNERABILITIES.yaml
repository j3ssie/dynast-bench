# Ground-truth answer key for the Swagger/OpenAPI vulnerable app.
# This file lives outside both build contexts and is never baked into an image.

app: swagger
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex (tenants). user2@bench.local is in Globex for cross-tenant
  BOLA/IDOR. A Globex DRAFT ("globex-internal") carries
  GLOBEX-CONFIDENTIAL-MARKER-7f3a. Weak default service credential admin/admin.

vulnerabilities:
  - id: DOCS-PUBLIC-001
    variant_paths: { vuln: vuln/app/main.py, safe: safe/app/main.py }
    symbol: openapi_schema/swagger_docs/redoc
    route: "GET /api/schema/ and /api/docs/"
    cwe: CWE-200
    owasp: "API8:2023-Security Misconfiguration"
    severity: medium
    difficulty: E
    discovery: static-html
    taint: config
    reachability: pre-auth
    near_miss: NM-DOCS-001
    match:
      http: { method: GET, path: "/api/schema/" }
      http_alt: ["/api/docs/"]
      file: { path: vuln/app/main.py, symbol: openapi_schema/swagger_docs/redoc, lines: [281, 287] }
    poc: ground-truth/verify/docs_public_001.sh
    documented: true
    api_version: none
    notes: "Swagger UI, ReDoc, and the OpenAPI document are public in the vulnerable production variant."

  - id: SWAGGERUI-001
