near_misses:
  - id: NM-DOCS-001
    path: vuln/app/main.py
    symbol: swagger_docs_v2
    of: SWAGGERUI-001
    match:
      file: { path: vuln/app/main.py, symbol: swagger_docs_v2, lines: [309, 313] }
    notes: "Second docs mount hardcodes the schema URL and states queryConfigEnabled=false."
  - id: NM-V1-USER-001
    path: vuln/app/main.py
    symbol: user_detail
    of: ZOMBIE-001
    match:
      file: { path: vuln/app/main.py, symbol: user_detail, lines: [342, 352] }
    notes: "v1 user detail applies an organization check beside the unfiltered v0 zombie route."
  - id: NM-USER-SERIALIZER-001
    path: vuln/app/main.py
    symbol: public_user(sensitive=False)
    of: DRIFT-001
    match:
      file: { path: vuln/app/main.py, symbol: "public_user(sensitive=False)", lines: [73, 126] }
    notes: "Safe serializer shape omits passwordHash/resetToken and explicit writable profile fields are documented."
  - id: NM-ORDERING-001
    path: vuln/app/main.py
    symbol: list_posts SECURE branch allowlist
    of: ORDER-SQLI-001
    match:
      file: { path: vuln/app/main.py, symbol: "list_posts SECURE branch allowlist" }
    notes: "The patched branch allowlists id/title/slug and rejects arbitrary ordering expressions."
  - id: NM-SSRF-001
    path: vuln/app/main.py
    symbol: is_private_or_internal
    of: SSRF-001
    match:
      file: { path: vuln/app/main.py, symbol: is_private_or_internal, lines: [464, 469] }
    notes: "Patched branch blocks private/internal hosts and safely consumes partner YAML without trusting role."
