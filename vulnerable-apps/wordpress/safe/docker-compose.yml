name: safe-wordpress
services:
  wordpress:
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 1024
    build: .
    environment:
      VARIANT: safe
      BENCH_VERIFY_TOKEN: benchsecret
    ports:
      - "127.0.0.1:${DYNAST_PORT:-13311}:3000"
    depends_on:
      internal-sink:
        condition: service_started
  internal-sink:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    image: node:22-alpine
    working_dir: /srv
    volumes:
      - ./internal-sink.mjs:/srv/internal-sink.mjs:ro
    command: ["node", "/srv/internal-sink.mjs"]
