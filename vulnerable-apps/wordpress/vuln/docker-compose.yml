name: vuln-wordpress
services:
  wordpress:
    build: .
    environment:
      VARIANT: vuln
      BENCH_VERIFY_TOKEN: benchsecret
    ports:
      - "127.0.0.1:${DYNAST_PORT:-13311}:3000"
    depends_on:
      internal-sink:
        condition: service_started
  internal-sink:
    image: node:22-alpine
    working_dir: /srv
    volumes:
      - ./internal-sink.mjs:/srv/internal-sink.mjs:ro
    command: ["node", "/srv/internal-sink.mjs"]
