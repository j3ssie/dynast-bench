# Attack-surface catalog for wordpress - the endpoint-coverage denominator.
#
# Every operation a tool is expected to DISCOVER. Coverage is measured against
# this list, so it must stay complete: an entry removed here makes every tool
# look better without anyone touching a tool.
#
# Drafted by dynast-bench/tools/derive-surface.ts, then reviewed by hand.
app: wordpress
entry: http://127.0.0.1:13311

operations:
  - id: http.wp-json-bench-tasks-v1-task.get
    kind: http
    method: GET
    path: "/wp-json/bench-tasks/v1/task"
    params: [id]
    discovery: static-html
    reachability: pre-auth
    vulns: [SQLI-001]
  - id: http.wp-json-bench-tasks-v1-report.get
    kind: http
    method: GET
    path: "/wp-json/bench-tasks/v1/report"
    discovery: static-html
    reachability: user
    vulns: [SQLI-002]
  - id: http.wp-admin-admin-post-php.post
    kind: http
    method: POST
    path: "/wp-admin/admin-post.php"
    query: { action: bench_set_webhook }
    discovery: static-html
    reachability: user
    vulns: [CSRF-001]
  - id: http.wp-admin-admin-post-php.post-2
    kind: http
    method: POST
    path: "/wp-admin/admin-post.php"
    query: { action: bench_admin_export }
    discovery: static-html
    reachability: user
    vulns: [AUTHZ-001]
  - id: http.wp-admin-admin-ajax-php.get
    kind: http
    method: GET
    path: "/wp-admin/admin-ajax.php"
    query: { action: bench_promote_user }
    discovery: static-html
    reachability: pre-auth
    vulns: [NOPRIV-001]
  - id: http.wp-json-bench-tasks-v1-import.post
    kind: http
    method: POST
    path: "/wp-json/bench-tasks/v1/import"
