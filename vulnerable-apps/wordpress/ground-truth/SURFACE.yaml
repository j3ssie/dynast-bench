    discovery: static-html
    reachability: pre-auth
    vulns: [UPLOAD-001]
  - id: http.wp-admin-admin-php.get
    kind: http
    method: GET
    path: "/wp-admin/admin.php"
    query: { page: bench_tasks }
    params: [view]
    discovery: static-html
    reachability: pre-auth
    vulns: [LFI-001]
  - id: http.wp-json-bench-tasks-v1-fetch.get
