    vulns: [SSRF-001]
  - id: http.tasks.get
    kind: http
    method: GET
    path: "/tasks"
    params: [id]
    discovery: static-html
    reachability: pre-auth
    vulns: [XSS-STORED-001]
  - id: http.search.get
    kind: http
    method: GET
    path: "/search"
    params: [q]
    discovery: static-html
    reachability: pre-auth
    vulns: [XSS-REFLECT-001]
  - id: http.wp-json-bench-tasks-v1-private-task.get
