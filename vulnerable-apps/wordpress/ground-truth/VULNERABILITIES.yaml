    symbol: bench_sqli_route
    route: "GET /wp-json/bench-tasks/v1/task?id="
    cwe: CWE-89
    owasp: "A03:2021-Injection"
    severity: high
    difficulty: E
    discovery: static-html
    taint: in-file
    reachability: pre-auth
    near_miss: NM-SQL-001
