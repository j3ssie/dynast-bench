# Ground-truth answer key for the wordpress vulnerable app.
# PoCs exit 0 when the target is vulnerable and non-zero when fixed.
app: wordpress
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex. user2@bench.local is in Globex for cross-tenant IDOR.
  The Globex draft task contains GLOBEX-CONFIDENTIAL-MARKER-7f3a.
  Vulnerable variant also accepts the weak default credential admin/admin.

vulnerabilities:
