near_misses:
  - id: NM-SQL-001
    path: vuln/src/app.php
    symbol: BenchWpdb::prepare
    of: SQLI-001
    match:
      file: { path: vuln/src/app.php, symbol: "BenchWpdb::prepare", lines: [7, 64] }
    notes: "Adjacent wpdb prepare helper models the safe SQL construction scanners should prefer."
  - id: NM-SQL-002
    path: safe/src/app.php
    symbol: bench_second_order_report
    of: SQLI-002
    match:
      file: { path: safe/src/app.php, symbol: bench_second_order_report, lines: [151, 152] }
    notes: "Safe twin keeps the report feature but uses prepare and literal filtering."
  - id: NM-CSRF-001
    path: safe/src/app.php
    symbol: bench_admin_post_route
    of: CSRF-001
    match:
      file: { path: safe/src/app.php, symbol: bench_admin_post_route, lines: [248, 252] }
    notes: "State-changing action requires the static benchmark nonce bench-nonce."
  - id: NM-AUTHZ-001
    path: safe/src/app.php
    symbol: bench_admin_post_route
    of: AUTHZ-001
    match:
      file: { path: safe/src/app.php, symbol: bench_admin_post_route }
    notes: "Admin export keeps the route but checks the admin role."
  - id: NM-LFI-001
    path: safe/src/app.php
    symbol: bench_admin_page_route
    of: LFI-001
    match:
      file: { path: safe/src/app.php, symbol: bench_admin_page_route, lines: [264, 267] }
    notes: "Safe view loader uses an allowlist rather than including the requested path."
  - id: NM-XSS-001
    path: safe/src/app.php
    symbol: bench_task_page
    of: XSS-STORED-001
    match:
      file: { path: safe/src/app.php, symbol: bench_task_page, lines: [281, 283] }
    notes: "Safe twin renders the same task body through htmlspecialchars."
