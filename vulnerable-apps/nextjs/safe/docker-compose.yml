name: safe-nextjs
services:
  app:
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 1024
    build: .
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:3000"]
    environment:
      DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_URL: http://localhost:3000
      JWT_SECRET: dev-super-secret-change-me
      # FIXED SECRET-001: no NEXT_PUBLIC_ key is handed to the browser bundle.
      VERIFY_TOKEN: benchsecret
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/_verify/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
  postgres:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    image: postgres:16.4
    environment: { POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 512
    image: redis:7.4.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 512
    image: axllent/mailpit:v1.20
    ports: ["127.0.0.1:${DYNAST_PORT_MAILPIT_8025:-13312}:8025", "127.0.0.1:${DYNAST_PORT_MAILPIT_1025:-13313}:1025"]
