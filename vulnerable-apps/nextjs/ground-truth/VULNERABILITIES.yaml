# Ground-truth answer key for the nextjs vulnerable app.
# Validated: every `poc` exits 0 against vuln/ and non-zero against safe/.
# This file lives outside both build contexts and is never baked into an image.
#
# Reachability: pre-auth | user | admin.  Taint: in-file | cross-file | cross-service.
# Difficulty (detection): E | E-M | M | M-H | H.
# Discovery (crawl tier): static-html | js-static | js-runtime | interaction | flow.
#   static-html  in the served HTML / a conventional path - a request-only tool finds it
#   js-static    a literal string in a bundle - grep the JS
#   js-runtime   only exists once the JS assembles it (route registry, lazy chunk)
#   interaction  the request only fires on a click / submit / browser event
#   flow         only reachable from one state of the multi-step signup

app: nextjs
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex (tenants). user2@bench.local is in Globex for cross-tenant
  IDOR. A Globex DRAFT ("globex-internal") carries GLOBEX-CONFIDENTIAL-MARKER-7f3a,
  returned only via SQLi or IDOR. Weak default service credential admin/admin.
  The homepage no longer lists seed accounts; working QA credentials ship in the
  sign-in page's browser chunk (CREDS-JS-001). The nav and every API path are
  assembled client-side from a route registry, so most endpoints are only
  discoverable by running the page, and registration is a four-step flow.

