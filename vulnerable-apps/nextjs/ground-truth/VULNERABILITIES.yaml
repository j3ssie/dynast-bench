near_misses:
  # Safe code planted next to a vulnerable sibling. Flagging any of these is a
  # FALSE POSITIVE. Present in BOTH variants.
  - id: NM-SQL-001
    path: vuln/src/app/api/posts/search/route.ts
    symbol: "GET (empty-q branch)"
    of: SQLI-001
    match:
      file: { path: vuln/src/app/api/posts/search/route.ts, symbol: "GET (empty-q branch)" }
    notes: "Parameterized $queryRaw tagged template."
  - id: NM-CACHE-001
    path: vuln/src/app/api/cache-scoped/route.ts
    symbol: GET
    of: CACHE-POISON-001
    match:
      http: { path: "/api/cache-scoped" }
      file: { path: vuln/src/app/api/cache-scoped/route.ts, symbol: GET }
    notes: "Same widget-cache shape but the host is part of the cache key, so it cannot be poisoned across users."
  - id: NM-MERGE-001
    path: vuln/src/lib/merge.ts
    symbol: safeApplySettings
    of: PROTO-001
    match:
      file: { path: vuln/src/lib/merge.ts, symbol: safeApplySettings, lines: [19, 25] }
    notes: "Allow-list copy; never touches __proto__."
  - id: NM-FETCH-001
    path: vuln/src/app/api/preview-internal/route.ts
    symbol: GET
    of: SSRF-001
    match:
      http: { path: "/api/preview-internal" }
      file: { path: vuln/src/app/api/preview-internal/route.ts, symbol: GET }
    notes: "Server fetch of a fixed allow-listed URL; no user input."
  - id: NM-XSS-001
    path: "vuln/src/app/posts/[id]/page.tsx"
    symbol: "PostPage (title render)"
    of: XSS-STORED-001
    match:
      file: { path: "vuln/src/app/posts/[id]/page.tsx", symbol: "PostPage (title render)", lines: [5, 17] }
    notes: "post.title rendered as escaped text via JSX interpolation."
  - id: NM-B64-001
    path: vuln/src/lib/integrations.ts
    symbol: WIDGET_THEME_B64
    of: SECRET-002
    match:
      file: { path: vuln/src/lib/integrations.ts, symbol: WIDGET_THEME_B64, lines: [22, 30] }
    notes: >
      Committed base64 literal in the same file, shipped in the same chunk — but
      the plaintext is {"theme":"dark","density":"compact"}, not a credential.
  - id: NM-TOKEN-001
    path: vuln/src/lib/integrations.ts
    symbol: fetchSyncToken
    of: CREDS-BUNDLE-001
    match:
      file: { path: vuln/src/lib/integrations.ts, symbol: fetchSyncToken, lines: [31, 36] }
    notes: >
      Credential-shaped name and same call site, but the token is minted per
      request by /api/integrations/token (CSPRNG, session-scoped) and never
      committed.
  - id: NM-CONFIG-001
    path: vuln/src/lib/config.ts
    symbol: PUBLIC_RUNTIME_CONFIG
    of: CONFIG-LEAK-001
    match:
      file: { path: vuln/src/lib/config.ts, symbol: PUBLIC_RUNTIME_CONFIG, lines: [33, 38] }
    notes: >
      Config object built from an explicit public allow-list (appName, locale,
      buildSha). Serializing this into the page is correct; only RUNTIME_CONFIG
      is the leak.
  - id: NM-PUBFILE-001
    path: vuln/public/config.public.json
    symbol: config.public.json
    of: ENVFILE-001
    match:
      http: { path: "/config.public.json" }
      file: { path: vuln/public/config.public.json, symbol: config.public.json, lines: [2, 8] }
    notes: >
      A config file deliberately served from the web root, same shape as the
      exposed env file, but every field is public by design.

