name: vuln-llmagent
services:
  app:
    build: ./
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:3000"]
    environment:
      PORT: "3000"
      LLM_BACKEND: "stub"
      VERIFY_TOKEN: "benchsecret"
      JWT_SECRET: "hardcoded-weak-secret"
      SERVICE_TOKEN: "svc-static-token"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/_verify/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
