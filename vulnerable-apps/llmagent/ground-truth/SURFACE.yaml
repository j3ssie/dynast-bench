    discovery: interaction
    reachability: user
    vulns: [REFUND-001]
  - id: llm.delegate
    kind: llm
    tool: delegate
    discovery: interaction
    reachability: user
    vulns: [AGENCY-002]
  - id: llm.browse
    kind: llm
