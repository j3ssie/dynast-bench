# Attack-surface catalog for llmagent - the endpoint-coverage denominator.
#
# Every operation a tool is expected to DISCOVER. Coverage is measured against
# this list, so it must stay complete: an entry removed here makes every tool
# look better without anyone touching a tool.
#
# Drafted by dynast-bench/tools/derive-surface.ts, then reviewed by hand.
app: llmagent
entry: http://127.0.0.1:13311

operations:
  - id: llm.run-shell
    kind: llm
    tool: run_shell
    discovery: interaction
    reachability: pre-auth
    vulns: [AGENCY-001]
  - id: http.api-runs.post
    kind: http
    method: POST
    path: "/api/runs"
    discovery: interaction
    reachability: user
    vulns: [HITL-001, MCP-001, MCP-002, AUTHZ-001, MODEL-001, RACE-001, CORS-001]
  - id: http.api-approvals-redeem.post
    kind: http
    method: POST
    path: "/api/approvals/redeem"
    discovery: interaction
    reachability: user
    vulns: [APPROVAL-001]
  - id: llm.refund-order
