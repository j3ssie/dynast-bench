name: safe-llmagent
services:
  app:
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 1024
    build: ./
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:3000"]
    environment:
      PORT: "3000"
      LLM_BACKEND: "stub"
      VERIFY_TOKEN: "benchsecret"
      # FIXED SECRET-001: JWT/service secrets are rotated out of hardcoded values.
      JWT_SECRET: "rotated-safe-secret"
      SERVICE_TOKEN: "svc-rotated-token"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/_verify/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
