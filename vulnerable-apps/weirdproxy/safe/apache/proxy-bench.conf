# Apache reverse proxy (HARDENED config).
# Case-insensitive prefix denial covers every trailing-slash / case variant, and
# the client's X-Internal-Auth header is unset before proxying.
ServerName localhost
ProxyPreserveHost On

# (?i) = case-insensitive; no `$` anchor = prefix match. Blocks /admin, /admin/,
# /ADMIN, /admin/x, ... likewise for /internal and /metrics.
<LocationMatch "(?i)^/admin">
    Require all denied
</LocationMatch>
<LocationMatch "(?i)^/internal">
    Require all denied
</LocationMatch>
<LocationMatch "(?i)^/metrics">
    Require all denied
</LocationMatch>

# Never trust a client-supplied internal marker.
RequestHeader unset X-Internal-Auth

ProxyPass / http://origin:9000/
ProxyPassReverse / http://origin:9000/
