# nginx reverse proxy (HARDENED config).
# Case-insensitive prefix denial covers /admin, /internal, /metrics and every
# trailing-slash / encoded-slash / case variant, and the client's X-Internal-Auth
# header is stripped before the request reaches the backend.
upstream origin_up {
    server origin:9000;
}

server {
    listen 80;
    server_name _;

    # Case-insensitive prefix match blocks /admin, /admin/, /admin%2f, /ADMIN, ...
    location ~* ^/(admin|internal|metrics)(/|$|%2f|%2F) {
        return 403;
    }
    location ~* ^/(admin|internal|metrics)$ {
        return 403;
    }

    location / {
        proxy_pass http://origin_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Never trust a client-supplied internal marker.
        proxy_set_header X-Internal-Auth "";
    }
}
