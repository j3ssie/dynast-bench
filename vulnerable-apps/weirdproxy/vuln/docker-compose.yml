name: vuln-weirdproxy
services:
  origin:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    build: { context: ./origin, additional_contexts: { dynast-annotations: ../../../dynast-bench/tools/annotations } }
    # internal only — the proxies are the security boundary; never published.
    expose: ["9000"]

  nginx:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    init: true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 1024
    build: { context: ./nginx, additional_contexts: { dynast-annotations: ../../../dynast-bench/tools/annotations } }
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:80"]
    depends_on:
      origin: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/api/_verify/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  apache:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    build: { context: ./apache, additional_contexts: { dynast-annotations: ../../../dynast-bench/tools/annotations } }
    ports: ["127.0.0.1:${DYNAST_PORT_APACHE_80:-13312}:80"]
    depends_on:
      origin: { condition: service_started }

  traefik:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    init: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    build: { context: ./traefik, additional_contexts: { dynast-annotations: ../../../dynast-bench/tools/annotations } }
    ports: ["127.0.0.1:${DYNAST_PORT_TRAEFIK_80:-13313}:80"]
    depends_on:
      origin: { condition: service_started }
