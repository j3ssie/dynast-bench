# nginx reverse proxy (VULNERABLE config).
# Blocks the protected paths, but with classic nginx pitfalls:
#  - `location = /admin` is an EXACT match, so /admin/ or /admin/x slip past.
#  - `location /internal` is case-sensitive, so /INTERNAL slips past.
#  - the client's X-Internal-Auth header is forwarded (not stripped).
upstream origin_up {
    server origin:9000;
}

server {
    listen 80;
    server_name _;

    # NGINX-ADMIN-SLASH: exact-match only — /admin/ and /admin/anything bypass it.
    location = /admin {
        return 403;
    }

    # NGINX-METRICS-SLASH: same exact-match pitfall on /metrics.
    location = /metrics {
        return 403;
    }

    # NGINX-INTERNAL-CASE: prefix match is case-sensitive — /INTERNAL bypasses.
    location /internal {
        return 403;
    }

    location / {
        proxy_pass http://origin_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # (vuln) NGINX-HEADER-TRUST: the client's X-Internal-Auth is passed through.
    }
}
