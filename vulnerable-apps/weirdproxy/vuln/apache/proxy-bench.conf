# Apache reverse proxy (VULNERABLE config).
# Blocks the protected paths, but with classic Apache pitfalls:
#  - anchored <LocationMatch "^/admin$"> only blocks the exact path, so /admin/
#    (and /admin/x) slip past.
#  - <Location> matching is case-sensitive, so /INTERNAL slips past.
#  - the client's X-Internal-Auth header is forwarded (not unset).
ServerName localhost
ProxyPreserveHost On

# APACHE-ADMIN-SLASH: anchored match blocks only the literal /admin.
<LocationMatch "^/admin$">
    Require all denied
</LocationMatch>

# APACHE-METRICS-SLASH: same anchored pitfall on /metrics.
<LocationMatch "^/metrics$">
    Require all denied
</LocationMatch>

# APACHE-INTERNAL-CASE: case-sensitive prefix — /INTERNAL bypasses.
<Location "/internal">
    Require all denied
</Location>

ProxyPass / http://origin:9000/
ProxyPassReverse / http://origin:9000/
