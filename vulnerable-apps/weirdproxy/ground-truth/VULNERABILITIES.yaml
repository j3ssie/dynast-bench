# Ground-truth answer key for the weirdproxy vulnerable app.
# Lives outside both build contexts and is never baked into an image.
#
# Shape: ONE internal origin behind THREE reverse proxies at once — nginx (the
# app-under-test on 13311), Apache (13312), Traefik (13313). The origin has no
# ACL of its own; each proxy is supposed to block /admin, /internal/*, /metrics,
# which hold GLOBEX-CONFIDENTIAL-MARKER-7f3a. Each planted bug is a request the
# proxy forwards but the origin normalizes back to a protected path (or a client
# header the proxy fails to strip). The vuln<->safe delta is CONFIG ONLY: the
# three proxy config files. The origin is byte-identical in both variants.

app: weirdproxy
entry: http://127.0.0.1:13311
seed_notes: >
  Internal Node origin (never published) normalizes paths permissively (decode,
  resolve ./.., collapse //, strip ;params, case-fold). nginx=13311 (app under
  test), apache=13312, traefik=13313. Protected paths /admin, /internal/*,
  /metrics carry GLOBEX-CONFIDENTIAL-MARKER-7f3a. The origin also trusts an
  X-Internal-Auth: trusted header that a correct proxy must strip. PoCs use
  curl --path-as-is so the crafted path reaches the proxy unmodified.

vulnerabilities:
  - id: NGINX-ADMIN-SLASH
    variant_paths: { vuln: vuln/nginx/default.conf, safe: safe/nginx/default.conf }
    symbol: "location = /admin"
    route: "GET /admin/ (nginx :13311)"
    cwe: CWE-436
    owasp: "A01:2021-Broken Access Control"
    severity: high
    difficulty: M
    discovery: static-html
    taint: cross-service
    reachability: pre-auth
    near_miss: NM-NGINX-DOTSEG
    match:
      http: { method: GET, path: "/admin/" }
      file: { path: vuln/nginx/default.conf, symbol: "location = /admin", lines: [3, 30] }
    poc: ground-truth/verify/nginx_admin_slash.sh
    notes: "Exact-match `location = /admin` blocks only the literal path; /admin/ falls through and the origin normalizes it back to /admin."
  - id: NGINX-ADMIN-ENCSLASH
    variant_paths: { vuln: vuln/nginx/default.conf, safe: safe/nginx/default.conf }
    symbol: "location = /admin"
    route: "GET /admin%2f (nginx :13311)"
    cwe: CWE-436
    owasp: "A01:2021-Broken Access Control"
    severity: high
    difficulty: M-H
    discovery: static-html
    taint: cross-service
    reachability: pre-auth
    near_miss: null
    match:
      http: { method: GET, path: "/admin%2f" }
      file: { path: vuln/nginx/default.conf, symbol: "location = /admin" }
    poc: ground-truth/verify/nginx_admin_encslash.sh
    notes: "nginx keeps %2f encoded so /admin%2f misses the exact match; the origin decodes %2f and normalizes to /admin."
  - id: NGINX-METRICS-SLASH
    variant_paths: { vuln: vuln/nginx/default.conf, safe: safe/nginx/default.conf }
    symbol: "location = /metrics"
    route: "GET /metrics/ (nginx :13311)"
    cwe: CWE-436
