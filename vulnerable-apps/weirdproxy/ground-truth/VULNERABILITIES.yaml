near_misses:
  - id: NM-NGINX-DOTSEG
    path: vuln/nginx/default.conf
    symbol: "location = /admin (nginx normalization)"
    of: NGINX-ADMIN-SLASH
    match:
      file: { path: vuln/nginx/default.conf, symbol: "location = /admin (nginx normalization)" }
    notes: "nginx resolves /./ before matching, so /./admin IS correctly blocked on nginx — flagging it as a bypass is a false positive."
  - id: NM-NGINX-MERGESLASH
    path: vuln/nginx/default.conf
    symbol: "merge_slashes (nginx default)"
    of: NGINX-ADMIN-SLASH
    match:
      file: { path: vuln/nginx/default.conf, symbol: "merge_slashes (nginx default)" }
    notes: "nginx collapses // by default, so //admin IS correctly blocked on nginx."
  - id: NM-APACHE-DOTSEG
    path: vuln/apache/proxy-bench.conf
    symbol: "Apache path normalization"
    of: APACHE-ADMIN-SLASH
    match:
      file: { path: vuln/apache/proxy-bench.conf, symbol: "Apache path normalization" }
    notes: "Apache resolves /./ and collapses // before Location matching, so /./admin and //admin ARE correctly blocked on Apache."
  - id: NM-TRAEFIK-TRAILSLASH
    path: vuln/traefik/dynamic.yml
    symbol: "PathPrefix(`/admin`)"
    of: TRAEFIK-ADMIN-DOUBLESLASH
    match:
      file: { path: vuln/traefik/dynamic.yml, symbol: "PathPrefix(`/admin`)" }
    notes: "PathPrefix is a prefix match, so /admin/ IS correctly blocked on Traefik — the trailing-slash trick that beats nginx/Apache does not beat Traefik."
