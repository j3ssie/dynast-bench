name: vuln-fastapi
services:
  app:
    build: .
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:3000"]
    environment:
      DATABASE_URL: postgresql+psycopg://bench:bench@postgres:5432/bench
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      JWT_SECRET: hardcoded-weak-secret
      APP_DEBUG: "true"
      VERIFY_TOKEN: benchsecret
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/_verify/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  postgres:
    image: postgres:16.4
    environment: { POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: bench, MINIO_ROOT_PASSWORD: bench12345 }
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["127.0.0.1:${DYNAST_PORT_MAILPIT_8025:-13312}:8025", "127.0.0.1:${DYNAST_PORT_MAILPIT_1025:-13313}:1025"]
