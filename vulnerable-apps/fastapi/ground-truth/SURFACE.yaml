# Attack-surface catalog for fastapi - the endpoint-coverage denominator.
#
# Every operation a tool is expected to DISCOVER. Coverage is measured against
# this list, so it must stay complete: an entry removed here makes every tool
# look better without anyone touching a tool.
#
# Drafted by dynast-bench/tools/derive-surface.ts, then reviewed by hand.
app: fastapi
entry: http://127.0.0.1:13311

operations:
  - id: http.api-auth-login.post
    kind: http
    method: POST
    path: "/api/auth/login"
    discovery: static-html
    reachability: pre-auth
    vulns: [AUTH-ENUM-001, DEFAULT-CREDS-001]
  - id: http.api-reports-admin-summary.get
    kind: http
