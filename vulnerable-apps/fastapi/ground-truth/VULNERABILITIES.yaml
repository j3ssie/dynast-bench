    notes: "Web cache poisoning: the shared cache is keyed on `key` only but the body reflects the unkeyed X-Forwarded-Host; the safe twin folds the host into the key (see cache_widget_scoped)."

near_misses:
  - id: NM-SQL-001
    path: vuln/app/main.py
    symbol: list_posts
    of: SQLI-001
    match:
      file: { path: vuln/app/main.py, symbol: list_posts, lines: [215, 220] }
    notes: "Same search shape using bound SQLAlchemy parameters."
  - id: NM-CACHE-001
    path: vuln/app/main.py
    symbol: cache_widget_scoped
    of: CACHE-POISON-001
    match:
      file: { path: vuln/app/main.py, symbol: cache_widget_scoped, lines: [461, 472] }
    notes: "Same widget cache but the host is part of the cache key, so it cannot be poisoned across users."
  - id: NM-SSTI-001
    path: vuln/app/main.py
    symbol: render_dashboard
    of: SSTI-001
    match:
      file: { path: vuln/app/main.py, symbol: render_dashboard, lines: [266, 270] }
    notes: "Renders a fixed template with context rather than compiling user input."
  - id: NM-DESER-001
    path: vuln/app/main.py
    symbol: import_json
    of: PICKLE-001
    match:
      file: { path: vuln/app/main.py, symbol: import_json, lines: [326, 330] }
    notes: "Accepts structured JSON rather than executable serialization formats."
  - id: NM-TRAVERSAL-001
    path: vuln/app/main.py
    symbol: download_avatar_safe
    of: TRAVERSAL-001
    match:
      file: { path: vuln/app/main.py, symbol: download_avatar_safe, lines: [394, 401] }
    notes: "Resolves the requested path and checks containment under the avatar directory."

