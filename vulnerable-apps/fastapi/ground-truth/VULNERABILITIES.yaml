  - id: CLASSPOLL-001
    variant_paths: { vuln: vuln/app/main.py, safe: safe/app/main.py }
    symbol: _deep_merge_attrs
    route: "POST /api/flags/merge"
    cwe: CWE-1321
    owasp: "A08:2021-Software and Data Integrity Failures"
    severity: high
    difficulty: H
    discovery: static-html
    taint: in-file
    reachability: pre-auth
    near_miss: NM-CLASSPOLL-001
    match:
      http: { method: POST, path: "/api/flags/merge" }
      file: { path: vuln/app/main.py, symbol: _deep_merge_attrs, lines: [757, 784] }
    poc: ground-truth/verify/classpoll_001.sh
    notes: >
      Python class pollution (the analogue of JS prototype pollution). A recursive
      attribute merge descends via getattr(dst, "__class__"), so a "__class__"
      key walks from the instance to the FeatureFlags CLASS and setattr mutates
      class-level defaults that persist across requests/instances. Two-step:
      POST /api/flags/merge to pollute, then GET /api/flags/state shows a fresh
      instance carrying the polluted role_override. flags/set is the safe near-miss.

