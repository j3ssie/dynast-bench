    owasp: "A07:2021-Identification and Authentication Failures"
    severity: low
    difficulty: E-M
    taint: in-file
    reachability: pre-auth
    near_miss: null
    match:
      http: { method: POST, path: "/api/auth/login" }
      file: { path: vuln/app/main.py, symbol: login, lines: [170, 207] }
    poc: ground-truth/verify/auth_enum_001.sh
    notes: "Login returns distinct user-not-found vs bad-password errors."

