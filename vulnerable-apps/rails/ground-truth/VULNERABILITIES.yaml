    symbol: UsersController#update
    route: "PATCH /api/users/me"
    cwe: CWE-915
    owasp: "A01:2021-Broken Access Control"
    severity: high
    difficulty: M
    discovery: static-html
    taint: in-file
    reachability: user
    near_miss: NM-MASSASSIGN-001
    match:
      http: { method: PATCH, path: "/api/users/me" }
      file: { path: vuln/app/controllers/users_controller.rb, symbol: "UsersController#update", lines: [9, 14] }
    poc: ground-truth/verify/massassign_001.sh
    notes: >
      Strong params use permit!, allowing role/is_admin/org_id overposting.

