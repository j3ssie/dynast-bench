# Ground-truth answer key for the golang vulnerable app.
# This file lives outside both build contexts and is never baked into an image.

app: golang
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex (tenants). user2@bench.local is in Globex for cross-tenant
  IDOR. A Globex DRAFT ("globex-internal") carries GLOBEX-CONFIDENTIAL-MARKER-7f3a,
  returned only via SQLi or IDOR. Vulnerable variant also seeds weak default service
  credential admin/admin.

vulnerabilities:
  - id: AUTH-ENUM-001
    variant_paths: { vuln: vuln/main.go, safe: safe/main.go }
    symbol: login
    route: "POST /api/auth/login"
    cwe: CWE-204
    owasp: "A07:2021-Identification and Authentication Failures"
    severity: low
    difficulty: E-M
    taint: in-file
    reachability: pre-auth
    near_miss: null
    match:
      http: { method: POST, path: "/api/auth/login" }
      file: { path: vuln/main.go, symbol: login, lines: [341, 385] }
    poc: ground-truth/verify/auth_enum_001.sh
    notes: "Login returns distinct user-not-found vs bad-password errors."

  - id: AUTH-RATE-001
