    reachability: pre-auth
    vulns: [SQLI-002]
  - id: http.api-reports-render.post
    kind: http
    method: POST
    path: "/api/reports/render"
    discovery: static-html
    reachability: pre-auth
    vulns: [SSTI-XSS-001]
  - id: http.api-reports-export.post
    kind: http
    method: POST
    path: "/api/reports/export"
    discovery: static-html
    reachability: pre-auth
    vulns: [CMD-001]
  - id: http.api-fetch.get
    kind: http
    method: GET
    path: "/api/fetch"
    params: [url]
    discovery: static-html
    reachability: pre-auth
    vulns: [SSRF-001]
  - id: http.api-attachments-download.get
    kind: http
    method: GET
    path: "/api/attachments/download"
    params: [name]
    discovery: static-html
    reachability: pre-auth
    vulns: [TRAVERSAL-001]
  - id: http.api-import-archive.post
    kind: http
    method: POST
    path: "/api/import/archive"
    discovery: static-html
    reachability: pre-auth
    vulns: [ZIPSLIP-001]
  - id: http.goto.get
    kind: http
    method: GET
    path: "/goto"
    params: [next]
    discovery: static-html
    reachability: pre-auth
    vulns: [REDIRECT-001]
  - id: http.root.options
    kind: http
    method: OPTIONS
    path: "/*"
    discovery: static-html
    reachability: pre-auth
    vulns: [CORS-001]
  - id: http.api-billing-seats.post
    kind: http
    method: POST
    path: "/api/billing/seats"
    discovery: static-html
    reachability: user
    vulns: [CSRF-001, BILLING-001]
  - id: http.search.get
    kind: http
    method: GET
    path: "/search"
    params: [q]
    discovery: static-html
