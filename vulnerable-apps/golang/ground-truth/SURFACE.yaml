# Attack-surface catalog for golang - the endpoint-coverage denominator.
#
# Every operation a tool is expected to DISCOVER. Coverage is measured against
# this list, so it must stay complete: an entry removed here makes every tool
# look better without anyone touching a tool.
#
# Drafted by dynast-bench/tools/derive-surface.ts, then reviewed by hand.
app: golang
entry: http://127.0.0.1:13311

operations:
  - id: http.api-auth-login.post
    kind: http
    method: POST
    path: "/api/auth/login"
    discovery: static-html
    reachability: pre-auth
    vulns: [AUTH-ENUM-001, AUTH-RATE-001, DEFAULT-CREDS-001]
  - id: http.api-reports-admin-summary.get
    kind: http
    method: GET
    path: "/api/reports/admin-summary"
    discovery: static-html
    reachability: pre-auth
    vulns: [JWT-001]
  - id: http.api-auth-reset.post
    kind: http
    method: POST
    path: "/api/auth/reset"
    discovery: static-html
    reachability: pre-auth
    vulns: [RESET-001]
  - id: http.api-posts-id.get
    kind: http
    method: GET
    path: "/api/posts/{id}"
    discovery: static-html
    reachability: user
    vulns: [IDOR-001]
  - id: http.api-admin-users.get
    kind: http
    method: GET
    path: "/api/admin/users"
    discovery: static-html
    reachability: user
    vulns: [AUTHZ-001]
  - id: http.api-users-me.patch
    kind: http
    method: PATCH
    path: "/api/users/me"
    discovery: static-html
    reachability: user
    vulns: [MASSASSIGN-001]
  - id: http.api-posts-search.get
    kind: http
    method: GET
    path: "/api/posts/search"
    params: [q]
    discovery: static-html
    reachability: pre-auth
    vulns: [SQLI-001]
  - id: http.api-reports-id-results.get
    kind: http
    method: GET
