name: vuln-golang
services:
  app:
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 1024
    build: .
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:3000"]
    environment:
      DATABASE_URL: postgres://bench:bench@postgres:5432/bench?sslmode=disable
      SESSION_KEY: "hardcoded-32-byte-gorilla-session-key"
      JWT_SECRET: "hardcoded-go-jwt-secret"
      EXPOSE_PPROF: "true"
      VERIFY_TOKEN: benchsecret
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/_verify/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  postgres:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    image: postgres:16.4
    ports: ["127.0.0.1:${DYNAST_PORT_POSTGRES_5432:-13312}:5432"]
    environment: { POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 20
  prometheus:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    image: prom/prometheus:v2.54.1
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:${DYNAST_PORT_PROMETHEUS_9090:-13313}:9090"]
    depends_on: { app: { condition: service_healthy } }
  grafana:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Admin123!
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["127.0.0.1:${DYNAST_PORT_GRAFANA_3000:-13314}:3000"]
