name: vuln-graphql
services:
  app:
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 1024
    build: ./
    ports:
      - "127.0.0.1:${DYNAST_PORT:-13311}:3000"
    environment:
      DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
      BILLING_URL: http://billing-svc:9099
      JWT_SECRET: hardcoded-weak-secret
      VERIFY_TOKEN: benchsecret
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      billing-svc:
        condition: service_started
  postgres:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    image: postgres:16.4
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 512
    image: redis:7.4.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  billing-svc:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512
    build: ./billing
    expose:
      - "9099"
