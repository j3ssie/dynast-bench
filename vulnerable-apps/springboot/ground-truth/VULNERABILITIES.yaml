  - id: PREAUTH-BYPASS-001
    variant_paths: { vuln: vuln/src/main/java/com/bench/springboot/NovelController.java, safe: safe/src/main/java/com/bench/springboot/NovelController.java }
    symbol: ReportAdminService.wrappedExport
    route: "GET /api/reports/admin-export"
    cwe: CWE-863
    owasp: "A01:2021-Broken Access Control"
    severity: high
    difficulty: H
    discovery: static-html
    discovery: static-html
    taint: cross-file
    reachability: pre-auth
    near_miss: null
    match:
      http: { method: GET, path: "/api/reports/admin-export" }
      file: { path: vuln/src/main/java/com/bench/springboot/NovelController.java, symbol: ReportAdminService.wrappedExport, lines: [18, 35] }
      markers: [SPRINGBOOT-PREAUTH-SECRET-7f3a]
    poc: ground-truth/verify/preauth_bypass_001.sh
    notes: >
      Spring method-security @PreAuthorize is enforced by an AOP proxy, which does
      NOT intercept self-invocation. A public wrapper in the same bean calls the
      admin-guarded adminOnlyExport() on `this`, so the guard is skipped and any
      pre-auth caller of /api/reports/admin-export gets the admin secret. The
      annotation looks present, so scanners assume it protects the path. Safe twin
      moves @PreAuthorize onto the wrapper (the true entry point).

