      file: { path: vuln/src/main/java/com/bench/springboot/FilesController.java, symbol: FilesController.read, lines: [23, 83] }
    poc: ground-truth/verify/traversal_bypass_001.sh
    notes: >
      Blacklist blocks the literal "../" and "#" but is checked BEFORE the path is
      normalised, and cleanup() then strips ;matrix params and URL-decodes a second
      time - so Spring/Tomcat bypasses defeat it: matrix parameter "..;/",
      double-encoded "%252e%252e%252f", and the double-encoded hash "%2523" (which
      a bare %23 would trip). No startsWith(DOCS_BASE) containment. Reads /etc/passwd.
      The read-safe sibling (NM) resolves identically then enforces containment.

