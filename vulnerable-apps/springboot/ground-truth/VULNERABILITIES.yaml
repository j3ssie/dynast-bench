  - id: TRAVERSAL-BYPASS-001
    variant_paths: { vuln: vuln/src/main/java/com/bench/springboot/FilesController.java, safe: safe/src/main/java/com/bench/springboot/FilesController.java }
    symbol: FilesController.read
    route: "GET /api/docs/read?path="
    cwe: CWE-22
