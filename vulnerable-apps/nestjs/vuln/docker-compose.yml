name: vuln-nestjs
services:
  nginx:
    image: nginx:1.27.1
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:80"]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx-secret.txt:/var/www/secret.txt:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      app: { condition: service_healthy }
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: benchsecret
      JWT_SECRET: hardcoded-weak-secret
      VERIFY_TOKEN: benchsecret
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      internal-sink: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/_verify/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  postgres:
    image: postgres:16.4
    environment: { POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  internal-sink:
    image: node:22-alpine
    command: ["node", "/internal-sink.mjs"]
    volumes:
      - ./internal-sink.mjs:/internal-sink.mjs:ro
volumes: { uploads: {} }
