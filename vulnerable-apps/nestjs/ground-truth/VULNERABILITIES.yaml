    symbol: login
    route: "POST /api/auth/login"
    cwe: CWE-204
    owasp: "A07:2021-Identification and Authentication Failures"
    severity: low
    difficulty: E-M
    taint: in-file
    reachability: pre-auth
    near_miss: null
    match:
      http: { method: POST, path: "/api/auth/login" }
      file: { path: vuln/src/app.controller.ts, symbol: login, lines: [203, 216] }
    poc: ground-truth/verify/auth_enum_001.sh
    notes: "Login returns distinct user-not-found vs bad-password errors."

