near_misses:
  - id: NM-SQL-001
    path: vuln/src/app.controller.ts
    symbol: updateProfileNearMiss
    of: SQLI-001
    match:
      file: { path: vuln/src/app.controller.ts, symbol: updateProfileNearMiss, lines: [193, 200] }
    notes: "Nearby data access uses fixed SQL and bound parameters rather than interpolating user input."
  - id: NM-OVERPOST-001
    path: vuln/src/app.controller.ts
    symbol: updateProfileNearMiss
    of: OVERPOST-001
    match:
      file: { path: vuln/src/app.controller.ts, symbol: updateProfileNearMiss }
    notes: "Profile update copies only displayName to a known column."
  - id: NM-HBS-001
    path: vuln/src/app.controller.ts
    symbol: renderSafePreview
    of: HBS-SSTI-001
    match:
      file: { path: vuln/src/app.controller.ts, symbol: renderSafePreview, lines: [224, 238] }
    notes: "Renders a fixed Handlebars template with double-stache escaping."
  - id: NM-DESER-001
    path: vuln/src/app.controller.ts
    symbol: importJsonNearMiss
    of: DESER-001
    match:
      file: { path: vuln/src/app.controller.ts, symbol: importJsonNearMiss, lines: [268, 273] }
    notes: "Accepts JSON.parse input rather than executable node-serialize function markers."
  - id: NM-TRAVERSAL-001
    path: vuln/src/app.controller.ts
    symbol: downloadNearMiss
    of: TRAVERSAL-001
    match:
      file: { path: vuln/src/app.controller.ts, symbol: downloadNearMiss, lines: [287, 294] }
    notes: "Uses basename and containment-style resolution for the preview download."
  - id: NM-NGINX-001
    path: vuln/infra/nginx.conf
    symbol: location /static/
    of: NGINX-ALIAS-001
    match:
      file: { path: vuln/infra/nginx.conf, symbol: "location /static/" }
    notes: "A normalized slash-terminated static location sits next to the vulnerable upload alias."

