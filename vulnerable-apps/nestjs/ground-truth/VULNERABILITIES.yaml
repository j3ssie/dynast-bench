      markers: [NESTJS-INTERNAL-SINK]
      cwe_family: CWE-843
    poc: ground-truth/verify/qsconfusion_001.sh
    notes: >
      Express/qs parameter type confusion. The SSRF guard is `if (typeof url ===
      'string') { block internal hosts }`, so sending ?url[]=... makes url an ARRAY,
      the typeof check is false, the guard is skipped entirely, and the array's
      first element is fetched - reaching the internal-only sink a plain string URL
      (which is blocked, 400) never could. Safe twin normalises to a string first.

