# Ground-truth answer key for the nestjs vulnerable app.
# This file lives outside both build contexts and is never baked into an image.

app: nestjs
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex (tenants). user2@bench.local is in Globex for cross-tenant
  IDOR. A Globex DRAFT ("globex-internal") carries GLOBEX-CONFIDENTIAL-MARKER-7f3a,
  returned only via SQLi/IDOR. Weak default service credential admin/admin.

