# Attack-surface catalog for gin - the endpoint-coverage denominator.
#
# Every operation a tool is expected to DISCOVER. Coverage is measured against
# this list, so it must stay complete: an entry removed here makes every tool
# look better without anyone touching a tool.
#
# Drafted by dynast-bench/tools/derive-surface.ts, then reviewed by hand.
app: gin
entry: http://127.0.0.1:13311

operations:
  - id: http.api-debug-info.get
    kind: http
    method: GET
    path: "/api/debug/info"
    discovery: static-html
    reachability: pre-auth
    vulns: [INFO-001]
  - id: http.api-auth-login.post
    kind: http
    method: POST
    path: "/api/auth/login"
    discovery: static-html
    reachability: pre-auth
    vulns: [DEFAULT-CREDS-001]
  - id: http.api-grants.get
    kind: http
    method: GET
    path: "/api/grants/"
    discovery: static-html
    reachability: user
    vulns: [IDOR-001]
  - id: http.api-grants-id
    kind: http
    path: "/api/grants/{token}"
    discovery: static-html
    reachability: user
    vulns: [IDOR-001]
  - id: http.api-users-me.patch
