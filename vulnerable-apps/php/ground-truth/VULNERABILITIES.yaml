near_misses:
  - id: NM-LFI-001
    path: vuln/app/public/page.php
    symbol: allowed_page_near_miss
    of: LFI-001
    match:
      file: { path: vuln/app/public/page.php, symbol: allowed_page_near_miss, lines: [5, 10] }
    notes: "Same file contains an allowlist router helper."
  - id: NM-AUTH-001
    path: vuln/app/public/login.php
    symbol: safe token comparison in safe twin
    of: TYPEJUGGLE-001
    match:
      file: { path: vuln/app/public/login.php, symbol: "safe token comparison in safe twin" }
    notes: "Safe twin uses hash_equals() rather than loose ==."
  - id: NM-DESER-001
    path: vuln/app/public/import.php
    symbol: json_import_near_miss
    of: UNSERIALIZE-001
    match:
      file: { path: vuln/app/public/import.php, symbol: json_import_near_miss }
    notes: "Nearby JSON import decodes data rather than invoking PHP object deserialization."
  - id: NM-SQL-001
    path: vuln/app/public/search.php
    symbol: safe_search_near_miss
    of: SQLI-001
    match:
      file: { path: vuln/app/public/search.php, symbol: safe_search_near_miss }
    notes: "Nearby helper uses a prepared statement with bound parameters."
  - id: NM-XSS-001
    path: safe/app/public/search.php
    symbol: htmlspecialchars output
    of: XSS-REFLECT-001
    match:
      file: { path: safe/app/public/search.php, symbol: "htmlspecialchars output" }
    notes: "Safe twin escapes attacker-controlled output with htmlspecialchars()."
