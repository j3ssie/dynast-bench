# Ground-truth answer key for the php vulnerable app.
# This file lives outside both build contexts and is never baked into an image.

app: php
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex (tenants). user2@bench.local is in Globex for cross-tenant
  IDOR. A Globex DRAFT ("globex-internal") carries GLOBEX-CONFIDENTIAL-MARKER-7f3a,
  returned only via SQLi/IDOR. Weak default service credential admin/admin is present
  only in vuln/; safe/ rotates it.

vulnerabilities:
  - id: LFI-001
    variant_paths: { vuln: vuln/app/public/page.php, safe: safe/app/public/page.php }
    symbol: page include
    route: "GET /page.php?page="
    cwe: CWE-98
    owasp: "A03:2021-Injection"
    severity: critical
    difficulty: E-M
    taint: in-file
    reachability: pre-auth
    near_miss: NM-LFI-001
    match:
      http: { method: GET, path: "/page.php", params: [page] }
      file: { path: vuln/app/public/page.php, symbol: "page include", lines: [4, 4] }
    poc: ground-truth/verify/lfi_001.sh
    notes: "page is passed directly to include(), allowing local file inclusion."
  - id: TYPEJUGGLE-001
    variant_paths: { vuln: vuln/app/public/login.php, safe: safe/app/public/login.php }
    symbol: login magic token
    route: "POST /login.php"
    cwe: CWE-697
    owasp: "A07:2021-Identification and Authentication Failures"
    severity: high
    difficulty: M-H
    taint: in-file
    reachability: pre-auth
    near_miss: NM-AUTH-001
    match:
      http: { method: POST, path: "/login.php" }
      file: { path: vuln/app/public/login.php, symbol: "login magic token", lines: [13, 22] }
    poc: ground-truth/verify/typejuggle_001.sh
    notes: "magic_token is compared to a magic-hash string with PHP loose ==."
  - id: DEFAULT-CREDS-001
    variant_paths: { vuln: vuln/app/seed.php, safe: safe/app/seed.php }
    symbol: seed users
    route: "POST /login.php"
    cwe: CWE-1392
    owasp: "A07:2021-Identification and Authentication Failures"
    severity: medium
    difficulty: E
    taint: in-file
    reachability: pre-auth
    near_miss: null
    match:
      http: { method: POST, path: "/login.php" }
      file: { path: vuln/app/seed.php, symbol: "seed users", lines: [4, 32] }
    poc: ground-truth/verify/default_creds_001.sh
    notes: "Seeded service account uses admin/admin."
  - id: UNSERIALIZE-001
    variant_paths: { vuln: vuln/app/public/import.php, safe: safe/app/public/import.php }
    symbol: import restore
    route: "POST /import.php mode=unserialize"
    cwe: CWE-502
    owasp: "A08:2021-Software and Data Integrity Failures"
    severity: critical
    difficulty: H
    taint: in-file
    reachability: pre-auth
    near_miss: NM-DESER-001
    match:
      http: { method: POST, path: "/import.php" }
      file: { path: vuln/app/public/import.php, symbol: "import restore", lines: [10, 10] }
    poc: ground-truth/verify/unserialize_001.sh
    notes: "Attacker-controlled serialized PHP object reaches unserialize() and a file-write gadget."
  - id: UPLOAD-001
    variant_paths: { vuln: vuln/app/public/profile.php, safe: safe/app/public/profile.php }
    symbol: avatar upload
    route: "POST /profile.php"
    cwe: CWE-434
    owasp: "A03:2021-Injection"
    severity: critical
    difficulty: M
    taint: in-file
    reachability: user
    near_miss: null
    match:
      http: { method: POST, path: "/profile.php" }
      file: { path: vuln/app/public/profile.php, symbol: "avatar upload", lines: [6, 22] }
    poc: ground-truth/verify/upload_001.sh
    notes: "Avatar upload saves attacker-controlled .php under the Apache webroot."
  - id: SQLI-001
    variant_paths: { vuln: vuln/app/public/search.php, safe: safe/app/public/search.php }
    symbol: search
    route: "GET /search.php?q="
    cwe: CWE-89
    owasp: "A03:2021-Injection"
    severity: high
    difficulty: E
    taint: in-file
    reachability: pre-auth
    near_miss: NM-SQL-001
    match:
      http: { method: GET, path: "/search.php", params: [q] }
      file: { path: vuln/app/public/search.php, symbol: search, lines: [9, 15] }
      markers: [GLOBEX-CONFIDENTIAL-MARKER-7f3a]
    poc: ground-truth/verify/sqli_001.sh
    notes: "q is interpolated into a PDO query string."
  - id: CMD-001
