      http: { path: "/api/signup/resend.php" }
      file: { path: vuln/app/public/api/signup/resend.php, symbol: resend.php, lines: [9, 13] }
    notes: "Constant, rate-limited sibling of start.php; not an enumeration oracle."
  - id: NM-SIGNUP-TOKEN-001
