  - id: NM-AGG-001
    path: vuln/app/public/tools/report.php
    symbol: report.php aggregate branch
    of: CODEINJ-001
    match:
      file: { path: vuln/app/public/tools/report.php, symbol: "report.php aggregate branch", lines: [17, 28] }
    notes: "Same file's allow-listed aggregate path (count/sum/max); unknown names rejected."
  - id: NM-SIGNUP-RESEND-001
