# Ground-truth answer key for the php vulnerable app.
# This file lives outside both build contexts and is never baked into an image.

app: php
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex (tenants). user2@bench.local is in Globex for cross-tenant
  IDOR. A Globex DRAFT ("globex-internal") carries GLOBEX-CONFIDENTIAL-MARKER-7f3a,
  returned only via SQLi/IDOR. Weak default service credential admin/admin is present
  only in vuln/; safe/ rotates it.

vulnerabilities:
  - id: LFI-001
    variant_paths: { vuln: vuln/app/public/page.php, safe: safe/app/public/page.php }
    symbol: page include
    route: "GET /page.php?page="
    cwe: CWE-98
    owasp: "A03:2021-Injection"
    severity: critical
    difficulty: E-M
    discovery: static-html
    taint: in-file
    reachability: pre-auth
    near_miss: NM-LFI-001
    match:
      http: { method: GET, path: "/page.php", params: [page] }
      file: { path: vuln/app/public/page.php, symbol: "page include", lines: [4, 4] }
    poc: ground-truth/verify/lfi_001.sh
    notes: "page is passed directly to include(), allowing local file inclusion."
