    symbol: invite_token
    of: SIGNUP-TOKEN-001
    match:
      file: { path: vuln/app/inc/signup.php, symbol: invite_token, lines: [11, 24] }
    notes: "random_bytes CSPRNG beside the clock-derived signup code."
  - id: NM-LFI-001
