name: safe-php
services:
  app:
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 1024
    build: .
    ports: ["127.0.0.1:${DYNAST_PORT:-13311}:80"]
    environment:
      DB_HOST: mysql
      DB_NAME: bench
      DB_USER: bench
      DB_PASS: bench
      VERIFY_TOKEN: benchsecret
      SMTP_HOST: mailpit
      APP_URL: "http://127.0.0.1:${DYNAST_PORT:-13311}"
      PHP_DISPLAY_ERRORS: "Off"
    depends_on:
      mysql: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/api/_verify/health.php"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  mysql:
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bench
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 512
    image: axllent/mailpit:v1.20
    ports: ["127.0.0.1:${DYNAST_PORT_MAILPIT_8025:-13313}:8025", "127.0.0.1:${DYNAST_PORT_MAILPIT_1025:-13314}:1025"]
