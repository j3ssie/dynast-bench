# Ground-truth answer key for the aspnet vulnerable app.
# This file lives outside both build contexts and is never baked into an image.
app: aspnet
entry: http://127.0.0.1:13311
seed_notes: >
  Orgs Acme + Globex. user2@bench.local is in Globex for cross-tenant IDOR.
  A Globex DRAFT carries GLOBEX-CONFIDENTIAL-MARKER-7f3a. Weak admin/admin is present in vuln.
