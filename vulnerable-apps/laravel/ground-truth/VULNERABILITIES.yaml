# Ground-truth answer key for the laravel vulnerable app.
# Lives outside both build contexts and is never baked into an image.

app: laravel
entry: http://127.0.0.1:13311
seed_notes: >
  Modern Laravel 11 (PHP 8.3, Apache, MySQL). Orgs Acme + Globex (tenants).
  user2@bench.local is in Globex for cross-tenant IDOR. A Globex DRAFT
  ("globex-internal") carries GLOBEX-CONFIDENTIAL-MARKER-7f3a, returned only via
  SQLi/IDOR. A weak service account admin/admin exists only in vuln/. Seed users:
  admin@bench.local/Admin123!, editor@bench.local/Editor123!,
  user1@bench.local/User123! (Acme), user2@bench.local/User123! (Globex).
  CSRF is enabled app-wide (PoCs scrape the _token); one route is the planted
  exception. TrimStrings is active, so SQLi PoCs comment with `#`, not `-- `.

