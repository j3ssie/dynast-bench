# Attack-surface catalog for laravel - the endpoint-coverage denominator.
#
# Every operation a tool is expected to DISCOVER. Coverage is measured against
# this list, so it must stay complete: an entry removed here makes every tool
# look better without anyone touching a tool.
#
# Drafted by dynast-bench/tools/derive-surface.ts, then reviewed by hand.
app: laravel
entry: http://127.0.0.1:13311

operations:
  - id: http.search.get
    kind: http
    method: GET
    path: "/search"
    params: [q]
    discovery: js-runtime
    reachability: pre-auth
    vulns: [SQLI-001, XSS-REFLECT-001]
  - id: http.reports-titles.get
    kind: http
    method: GET
    path: "/reports/titles"
    discovery: js-runtime
    reachability: user
    vulns: [SQLI-002]
  - id: http.posts-id-comments.post
    kind: http
    method: POST
    path: "/posts/{id}/comments"
    discovery: interaction
    reachability: user
    vulns: [XSS-STORED-001]
  - id: http.tools-preview.get
    kind: http
    method: GET
    path: "/tools/preview"
    params: [tpl]
    discovery: js-runtime
    reachability: pre-auth
    vulns: [SSTI-001]
  - id: http.tools-export.get
    kind: http
    method: GET
    path: "/tools/export"
    params: [format]
    discovery: js-runtime
    reachability: pre-auth
    vulns: [CMD-001]
  - id: http.profile-avatar.post
    kind: http
    method: POST
    path: "/profile/avatar"
