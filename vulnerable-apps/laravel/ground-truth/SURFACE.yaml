    path: "/"
    discovery: static-html
    reachability: pre-auth
    vulns: [PHPMYADMIN-001, CORS-001]
    notes: "benign? derived from routes/web.php - REVIEW"
  - id: http.nav.get
    kind: http
    method: GET
    path: "/nav"
    discovery: static-html
    notes: "literal fetch(\"/nav\") inline in home.blade.php"
  - id: http.login.get
