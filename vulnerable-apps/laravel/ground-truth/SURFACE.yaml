    reachability: user
    vulns: [UPLOAD-001]
  - id: http.posts-id.get
    kind: http
    method: GET
    path: "/posts/{id}"
    discovery: js-runtime
    reachability: user
    vulns: [IDOR-001, XSS-STORED-001]
  - id: http.admin-users.get
