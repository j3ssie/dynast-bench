    notes: "reached from the nav response, like /posts/{id}"
  - id: http.posts.post
    kind: http
    method: POST
    path: "/posts"
    discovery: interaction
    notes: "form submit, like POST /posts/{id}"
  - id: http.posts-id-audit.get
    kind: http
