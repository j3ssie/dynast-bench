    discovery: js-runtime
    reachability: pre-auth
    vulns: [SSRF-001]
  - id: http.diagnostics.get
    kind: http
    method: GET
    path: "/diagnostics"
    discovery: js-runtime
    reachability: pre-auth
    vulns: [DEBUG-001]
  - id: http.env-backup.get
    kind: http
    method: GET
    path: "/.env.backup"
