    path: "/admin/users"
    discovery: js-runtime
    reachability: user
    vulns: [AUTHZ-001]
  - id: http.profile.post
    kind: http
    method: POST
    path: "/profile"
    discovery: interaction
    reachability: user
    vulns: [MASSASSIGN-001]
  - id: http.tools-download.get
    kind: http
    method: GET
    path: "/tools/download"
